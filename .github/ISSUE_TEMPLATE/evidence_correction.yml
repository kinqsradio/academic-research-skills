name: Evidence or citation correction
description: Identify unsupported guidance, a citation error, or a changed source.
title: "[Evidence]: "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content check
      options:
        - label: This report contains no credentials, participant data, private research, or vulnerability details.
          required: true
  - type: input
    id: location
    attributes:
      label: Affected file, section, and commit
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Guidance or claim to correct
      description: Identify the exact statement and explain the problem.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting source and locator
      description: Provide a permitted public link or bibliographic metadata, page/section/table/figure, and access limits. Do not upload source PDFs.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction and uncertainty
    validations:
      required: true
