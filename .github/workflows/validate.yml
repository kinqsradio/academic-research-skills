name: Validate research skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out contribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository structure and skill metadata
        run: python scripts/validate_repository.py
      - name: Test research readiness checker
        run: python scripts/research_status_tests.py
      - name: Test public-template guard with synthetic repositories
        run: python scripts/check_public_template_tests.py

  public-template:
    name: Public template boundary
    # Private project copies may contain research records. The public upstream
    # enforces this gate on its own main and incoming fork pull requests.
    if: github.repository == 'kinqsradio/academic-research-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out contribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check public template remains empty of project records
        run: python scripts/check_public_template.py
